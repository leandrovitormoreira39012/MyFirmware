; Standalone diagnosis only. Do not use this wiring with bruce-joker-s3 binaries.
[env:bruce-joker-test-ili9341]
board = bruce-joker-s3
board_build.arduino.memory_type = dio_opi
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.partitions = custom_16Mb.csv
board_upload.flash_size = 16MB
build_src_filter = -<*> +<../boards/bruce-joker-screen-test/main.cpp>
build_flags =
    -Iboards/bruce-joker-screen-test
    -DBRUCE_JOKER_SCREEN_TEST
    -DBRUCE_TEST_ILI9341
    -DBRUCE_UI_PT_BR
    -DCORE_DEBUG_LEVEL=1
lib_deps =
extra_scripts = post:build.py

[env:bruce-joker-test-st7789]
extends = env:bruce-joker-test-ili9341
build_unflags = -DBRUCE_TEST_ILI9341
