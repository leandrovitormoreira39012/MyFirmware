[env:bruce-joker-s3]
board = bruce-joker-s3
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.partitions = custom_16Mb.csv
board_upload.flash_size = 16MB
build_src_filter = ${env.build_src_filter} +<../boards/bruce-joker-s3>
build_flags =
    ${env.build_flags}
    -Iboards/bruce-joker-s3
    -DCORE_DEBUG_LEVEL=1
    -DBRUCE_UI_PT_BR
    -DDEVICE_NAME='"Bruce Joker S3"'
    -DIR_TX_PINS='{{"IR TX", 18}}'
    -DIR_RX_PINS='{{"IR RX", 21}}'
    -DRF_TX_PINS='{{"CC1101 GDO0", 15}}'
    -DRF_RX_PINS='{{"CC1101 GDO0", 15}}'

; Full shared-bus Bruce; ST7789 with INVOFF following the physical display test.
; Historical environment name retained for existing build/workflow commands.
[env:bruce-joker-s3-marauder]
extends = env:bruce-joker-s3
board_build.arduino.memory_type = dio_opi
board_build.flash_mode = dio
build_flags =
    ${env:bruce-joker-s3.build_flags}
    -DBRUCE_JOKER_MARAUDER
